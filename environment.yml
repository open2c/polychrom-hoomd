name: polychrom-hoomd
channels:
    - conda-forge
dependencies:
    - pip
    - python
    - numpy
    - scipy>=0.16
    - matplotlib>=2.0
    - pandas>=0.19
    - hoomd=*=*gpu*
    - fresnel>=0.13
    - gsd
    - h5py
    - joblib
    - pyside2
    - ipython
    - notebook
    - cupy
    - pip:
        - git+https://github.com/open2c/polykit.git
        - git+https://github.com/open2c/cooltools.git
        - git+https://github.com/Fudenberg-Research-Group/discrete-time-extrusion.git
